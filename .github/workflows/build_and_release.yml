name: Build and Release StudioBill Pro

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop (.exe Installer & Portable Zip)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Windows Setup Installer (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\windows\installer
          $ReleaseDir = if (Test-Path "build\windows\x64\runner\Release\StudioBillPro.exe") {
            "build\windows\x64\runner\Release"
          } elseif (Test-Path "build\windows\runner\Release\StudioBillPro.exe") {
            "build\windows\runner\Release"
          } else {
            Get-ChildItem -Path "build\windows" -Filter "StudioBillPro.exe" -Recurse | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          }
          Write-Host "Found Release Dir: $ReleaseDir"
          $FullReleasePath = (Resolve-Path $ReleaseDir).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DReleaseDir=$FullReleasePath" windows\installer\inno_setup.iss

      - name: Create Portable Zip
        shell: pwsh
        run: |
          $ReleaseDir = if (Test-Path "build\windows\x64\runner\Release\StudioBillPro.exe") {
            "build\windows\x64\runner\Release"
          } elseif (Test-Path "build\windows\runner\Release\StudioBillPro.exe") {
            "build\windows\runner\Release"
          } else {
            Get-ChildItem -Path "build\windows" -Filter "StudioBillPro.exe" -Recurse | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          }
          Compress-Archive -Path "$ReleaseDir\*" -DestinationPath "build\windows\installer\StudioBillPro-Windows-Portable.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/installer/*

      - name: Attach to GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/installer/StudioBillPro_v1.0.0_Setup.exe
            build/windows/installer/StudioBillPro-Windows-Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach to GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
