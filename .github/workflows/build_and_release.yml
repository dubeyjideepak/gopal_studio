name: Build and Release StudioBill Pro

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop (.exe Installer & Portable Zip)
    runs-on: windows-latest
    env:
      CL: "/await /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /D_SILENCE_EXPERIMENTAL_COROUTINE_SUPPORT_DEPRECATION_WARNING /D_SILENCE_ALL_CXX17_DEPRECATION_WARNINGS /D_SILENCE_ALL_CXX20_DEPRECATION_WARNINGS /D_SILENCE_ALL_CXX23_DEPRECATION_WARNINGS"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Patch Native Plugins and Firebase for Windows
        shell: pwsh
        run: |
          # 1. Scan Pub Cache and patch any CMakeLists with old minimum or inject Firebase SDK patch
          $pubCaches = @(
            "$env:LOCALAPPDATA\Pub\Cache",
            "$env:USERPROFILE\.pub-cache",
            "$env:USERPROFILE\AppData\Local\Pub\Cache"
          ) | Where-Object { Test-Path $_ }

          foreach ($pubCache in $pubCaches) {
            Write-Host "Scanning pub cache at: $pubCache"
            Get-ChildItem -Path $pubCache -Recurse -Filter "CMakeLists.txt" -ErrorAction SilentlyContinue | ForEach-Object {
              $path = $_.FullName
              $text = Get-Content -Raw -Path $path
              $modified = $false

              if ($text -match 'FIREBASE_CPP_SDK_DIR' -and $text -notmatch '_sdk_cmake_fixed') {
                $hook = 'if(EXISTS "${FIREBASE_CPP_SDK_DIR}/CMakeLists.txt")' + [System.Environment]::NewLine + '  file(READ "${FIREBASE_CPP_SDK_DIR}/CMakeLists.txt" _s)' + [System.Environment]::NewLine + '  string(REGEX REPLACE "cmake_minimum_required\\s*\\([^)]*\\)" "cmake_minimum_required(VERSION 3.5)" _s "${_s}")' + [System.Environment]::NewLine + '  file(WRITE "${FIREBASE_CPP_SDK_DIR}/CMakeLists.txt" "${_s}")' + [System.Environment]::NewLine + 'endif() # _sdk_cmake_fixed' + [System.Environment]::NewLine
                $text = $text.Replace('add_subdirectory(${FIREBASE_CPP_SDK_DIR}', $hook + 'add_subdirectory(${FIREBASE_CPP_SDK_DIR}')
                $modified = $true
                Write-Host "Injected CMake auto-patcher into: $path"
              }

              if ($text -match 'cmake_minimum_required\s*\(\s*VERSION\s*[0-2]\.') {
                $text = $text -replace 'cmake_minimum_required\s*\(\s*VERSION\s*[0-2]\.[0-9]+(\.[0-9]+)?\s*\)', 'cmake_minimum_required(VERSION 3.5)'
                $modified = $true
                Write-Host "Patched minimum CMake version in: $path"
              }

              if ($modified) {
                Set-Content -Path $path -Value $text -Encoding UTF8
              }
            }

            # 2. Patch printing plugin (keyword collision on 'default')
            Get-ChildItem -Path $pubCache -Recurse -Filter "print_job.h" -ErrorAction SilentlyContinue | ForEach-Object {
              $pjText = Get-Content -Raw -Path $_.FullName
              if ($pjText -match 'const bool default;') {
                $pjText = $pjText.Replace('const bool default;', 'const bool isDefault;')
                $pjText = $pjText.Replace('bool default,', 'bool isDefault,')
                $pjText = $pjText.Replace('default(default),', 'isDefault(isDefault),')
                Set-Content -Path $_.FullName -Value $pjText -Encoding UTF8
                Write-Host "Patched print_job.h in $($_.FullName)"
              }
            }

            Get-ChildItem -Path $pubCache -Recurse -Filter "printing_plugin.cpp" -ErrorAction SilentlyContinue | ForEach-Object {
              $ppText = Get-Content -Raw -Path $_.FullName
              if ($ppText -match 'printer\.default') {
                $ppText = $ppText.Replace('printer.default', 'printer.isDefault')
                Set-Content -Path $_.FullName -Value $ppText -Encoding UTF8
                Write-Host "Patched printing_plugin.cpp in $($_.FullName)"
              }
            }

            # 3. Patch share_plus plugin (C4596 illegal qualified name)
            Get-ChildItem -Path $pubCache -Recurse -Filter "share_plus_windows_plugin.h" -ErrorAction SilentlyContinue | ForEach-Object {
              $spText = Get-Content -Raw -Path $_.FullName
              if ($spText -match 'SharePlusWindowsPlugin::Utf16FromUtf8') {
                $spText = $spText.Replace('static std::wstring SharePlusWindowsPlugin::Utf16FromUtf8', 'static std::wstring Utf16FromUtf8')
                Set-Content -Path $_.FullName -Value $spText -Encoding UTF8
                Write-Host "Patched share_plus_windows_plugin.h in $($_.FullName)"
              }
            }

            # 4. Patch vector.h in share_plus (dependent template base names)
            Get-ChildItem -Path $pubCache -Recurse -Filter "vector.h" -ErrorAction SilentlyContinue | ForEach-Object {
              $vText = Get-Content -Raw -Path $_.FullName
              if ($vText -match 'typedef std::vector<ElementType> InternalVectorType;') {
                $vText = $vText.Replace('struct DefaultVectorTraits : public ElementTraits<T> {', "struct DefaultVectorTraits : public ElementTraits<T> {`n  using ElementType = typename ElementTraits<T>::ElementType;")
                $vText = $vText.Replace('typename RuntimeClass::IVector::T_complex', 'typename ABI::Windows::Foundation::Collections::IVector<T>::T_complex')
                Set-Content -Path $_.FullName -Value $vText -Encoding UTF8
                Write-Host "Patched vector.h in $($_.FullName)"
              }
            }

            # 5. Inject coroutine suppression across any headers/cpp in Pub Cache
            Get-ChildItem -Path $pubCache -Recurse -Include "*.h","*.cpp" -ErrorAction SilentlyContinue | ForEach-Object {
              $fText = Get-Content -Raw -Path $_.FullName
              if ($fText -match 'experimental/coroutine' -and $fText -notmatch '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS') {
                $fText = "#ifndef _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS`n#define _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS 1`n#endif`n#ifndef _SILENCE_EXPERIMENTAL_COROUTINE_SUPPORT_DEPRECATION_WARNING`n#define _SILENCE_EXPERIMENTAL_COROUTINE_SUPPORT_DEPRECATION_WARNING 1`n#endif`n" + $fText
                Set-Content -Path $_.FullName -Value $fText -Encoding UTF8
                Write-Host "Injected coroutine suppression into: $($_.FullName)"
              }
            }
          }

          # 6. Pre-download, pre-extract and patch firebase_cpp_sdk_windows before CMake runs
          $extractDir = "$PWD\build\windows\x64\extracted"
          New-Item -ItemType Directory -Force -Path $extractDir
          $zipPath = "$PWD\build\windows\x64\firebase_cpp_sdk_windows_12.7.0.zip"
          Write-Host "Pre-downloading Firebase C++ SDK 12.7.0..."
          Invoke-WebRequest -Uri "https://dl.google.com/firebase/sdk/cpp/firebase_cpp_sdk_windows_12.7.0.zip" -OutFile $zipPath
          Write-Host "Extracting Firebase C++ SDK..."
          Expand-Archive -Path $zipPath -DestinationPath $extractDir -Force

          $sdkCmake = "$extractDir\firebase_cpp_sdk_windows\CMakeLists.txt"
          if (Test-Path $sdkCmake) {
            $content = Get-Content -Raw -Path $sdkCmake
            $content = $content -replace 'cmake_minimum_required\s*\([^)]*\)', 'cmake_minimum_required(VERSION 3.5)'
            $extraFlags = [System.Environment]::NewLine + 'add_compile_options(/await)' + [System.Environment]::NewLine + 'add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS _SILENCE_EXPERIMENTAL_COROUTINE_SUPPORT_DEPRECATION_WARNING _SILENCE_ALL_CXX17_DEPRECATION_WARNINGS _SILENCE_ALL_CXX20_DEPRECATION_WARNINGS)' + [System.Environment]::NewLine
            $content = $content + $extraFlags
            Set-Content -Path $sdkCmake -Value $content -Encoding UTF8
            Write-Host "Successfully patched $sdkCmake with VERSION 3.5 and coroutine flags!"
          }

          # 7. Patch any headers in extracted SDK that include experimental/coroutine
          Get-ChildItem -Path "$extractDir\firebase_cpp_sdk_windows" -Recurse -Filter "*.h" -ErrorAction SilentlyContinue | ForEach-Object {
            $hText = Get-Content -Raw -Path $_.FullName
            if ($hText -match 'experimental/coroutine') {
              $hText = "#ifndef _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS`n#define _SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS 1`n#endif`n#ifndef _SILENCE_EXPERIMENTAL_COROUTINE_SUPPORT_DEPRECATION_WARNING`n#define _SILENCE_EXPERIMENTAL_COROUTINE_SUPPORT_DEPRECATION_WARNING 1`n#endif`n" + $hText
              Set-Content -Path $_.FullName -Value $hText -Encoding UTF8
              Write-Host "Injected coroutine suppression into header: $($_.FullName)"
            }
          }

      - name: Build Windows Release
        env:
          FIREBASE_CPP_SDK_DIR: ${{ github.workspace }}\build\windows\x64\extracted\firebase_cpp_sdk_windows
          CMAKE_CXX_FLAGS: "/await /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /D_SILENCE_EXPERIMENTAL_COROUTINE_SUPPORT_DEPRECATION_WARNING /D_SILENCE_ALL_CXX17_DEPRECATION_WARNINGS /D_SILENCE_ALL_CXX20_DEPRECATION_WARNINGS /D_SILENCE_ALL_CXX23_DEPRECATION_WARNINGS"
          CL: "/await /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS /D_SILENCE_EXPERIMENTAL_COROUTINE_SUPPORT_DEPRECATION_WARNING /D_SILENCE_ALL_CXX17_DEPRECATION_WARNINGS /D_SILENCE_ALL_CXX20_DEPRECATION_WARNINGS /D_SILENCE_ALL_CXX23_DEPRECATION_WARNINGS"
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Windows Setup Installer (.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\windows\installer
          $ReleaseDir = if (Test-Path "build\windows\x64\runner\Release\StudioBillPro.exe") {
            "build\windows\x64\runner\Release"
          } elseif (Test-Path "build\windows\runner\Release\StudioBillPro.exe") {
            "build\windows\runner\Release"
          } else {
            Get-ChildItem -Path "build\windows" -Filter "StudioBillPro.exe" -Recurse | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          }
          Write-Host "Found Release Dir: $ReleaseDir"
          $FullReleasePath = (Resolve-Path $ReleaseDir).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DReleaseDir=$FullReleasePath" windows\installer\inno_setup.iss

      - name: Create Portable Zip
        shell: pwsh
        run: |
          $ReleaseDir = if (Test-Path "build\windows\x64\runner\Release\StudioBillPro.exe") {
            "build\windows\x64\runner\Release"
          } elseif (Test-Path "build\windows\runner\Release\StudioBillPro.exe") {
            "build\windows\runner\Release"
          } else {
            Get-ChildItem -Path "build\windows" -Filter "StudioBillPro.exe" -Recurse | Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          }
          Compress-Archive -Path "$ReleaseDir\*" -DestinationPath "build\windows\installer\StudioBillPro-Windows-Portable.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/installer/*

      - name: Attach to GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/windows/installer/StudioBillPro_v1.0.0_Setup.exe
            build/windows/installer/StudioBillPro-Windows-Portable.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Attach to GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
